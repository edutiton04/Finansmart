<svg xmlns="http://www.w3.org/2000/svg" width="1984" height="768" viewBox="0 0 1984 768" role="img" aria-labelledby="title desc">
  <title id="title">FinanSmart — Gestão financeira pessoal</title>
  <desc id="desc">Banner azul-marinho com o nome FinanSmart, descrição de gestão financeira pessoal e gráfico de barras com seta de crescimento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03132f"/><stop offset="0.52" stop-color="#06265f"/><stop offset="1" stop-color="#001333"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#168bff"/><stop offset="1" stop-color="#4b9cff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05e6bd"/><stop offset="1" stop-color="#00b894"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff646b"/><stop offset="1" stop-color="#ff354d"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#075de2" stop-opacity=".5"/><stop offset="1" stop-color="#075de2" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
