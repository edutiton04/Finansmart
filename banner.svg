    <text x="676" y="354" font-size="148" font-weight="800" letter-spacing="-6" fill="url(#blue)">Smart</text>
    <text x="128" y="434" font-size="39" font-weight="400" fill="#e4ecff">Gestão financeira pessoal: contas, cartões, investimentos</text>
    <text x="128" y="491" font-size="39" font-weight="400" fill="#e4ecff">e relatórios.</text>
